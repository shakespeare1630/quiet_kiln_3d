[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sn17-crown-miner"
version = "0.1.0"
description = "Witnessed Codex image-to-Three.js reconstruction miner"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Pillow==13.0.0",
  "404-witness-client @ https://github.com/404-Repo/404-gen-subnet/releases/download/miner-runtime-v0.1.5/404_witness_client-0.2.17-py3-none-manylinux_2_34_x86_64.whl#sha256=70a7fda820edaa90d109817ac671487a3ac6a053ae0bb9b17991fe858671adfd ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "404-witness-client @ https://github.com/404-Repo/404-gen-subnet/releases/download/miner-runtime-v0.1.5/404_witness_client-0.2.17-py3-none-macosx_13_0_arm64.whl#sha256=29c6a541d64aa5152153cef173873f8a44340a26ceb5d6beb530ba11b74a009d ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "404-renderer-client @ https://github.com/404-Repo/404-gen-subnet/releases/download/miner-runtime-v0.1.5/404_renderer_client-0.1.4-py3-none-any.whl#sha256=35b1b77efe479a18713a0d817bd60749089cc7d0725c1738edbbcd8caccaa4fa",
  "404-miner-runtime @ https://github.com/404-Repo/404-gen-subnet/releases/download/miner-runtime-v0.1.5/404_miner_runtime-0.1.5-py3-none-any.whl#sha256=db3f70f71b25f57bd06030bb637ee2e643b3a60849d541074d9da7e15ddc6f0c",
]

[tool.setuptools]
packages = ["crown"]
py-modules = ["main"]

[tool.setuptools.package-data]
crown = ["*.json", "*.txt"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
